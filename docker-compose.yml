services:
  postgres:
    image: postgres:17-alpine
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservation_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: reservation-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    container_name: reservation-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - psql -h postgres -U postgres -d reservation_system -f /migrations/000001_create_users_table.up.sql
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: reservation-backend
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: reservation_system
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SESSION_TTL: 24h
      JWT_SECRET: reservation-system-secret
      JWT_ISSUER: reservation-system
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: reservation-frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
